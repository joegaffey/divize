<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=../../md.html" />
  <title>Redirecting to docs viewer…</title>
  <link rel="stylesheet" href="../../exp/css/hub.css" />
</head>
<body>
  <header class="topbar">
    <h1>DLPC <span class="muted">// Redirect</span></h1>
  </header>
  <main class="report" style="max-width:960px;margin:24px auto;padding:24px">
    <p class="status">Results moved to the shared docs viewer.</p>
  </main>
  <script>
    // Preserve the ?f= param into the shared viewer.
    var f = new URLSearchParams(location.search).get('f');
    location.replace(f ? '../../md.html?f=docs/experiments/' + f : '../../md.html');
  </script>
</body>
</html>
