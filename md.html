<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DLPC · Docs</title>
  <link rel="stylesheet" href="exp/css/hub.css" />
  <style>
    main.report { max-width: 960px; margin: 0 auto; padding: 24px; }
    .report h1 { font-size: 20px; margin: 0 0 8px; }
    .report h2 { font-size: 16px; margin: 28px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .report h3 { font-size: 13px; margin: 22px 0 8px; color: var(--accent-2); }
    .report p, .report li { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .report code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
    .report pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
    .report pre code { background: none; border: 0; padding: 0; }
    .report a { color: var(--accent); text-decoration: none; }
    .report a:hover { text-decoration: underline; }
    .report table { border-collapse: collapse; margin: 10px 0 18px; width: auto; }
    .report th, .report td { border: 1px solid var(--line); padding: 6px 12px; font-size: 12.5px; text-align: left; }
    .report th { background: var(--panel-2); color: var(--text); }
    .report td { color: var(--muted); }
    .report td:first-child, .report th:first-child { font-weight: 600; color: var(--text); }
    .report ul, .report ol { padding-left: 22px; }
    .report blockquote { border-left: 3px solid var(--accent); margin: 12px 0; padding: 2px 14px; color: var(--muted); }
    .report hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    .report h2 a, .report h3 a { color: inherit; }
    .status { padding: 16px 24px; color: var(--muted); font-size: 13px; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .topbar .back { color: var(--muted); font-size: 12px; }
    .topbar .back a { color: var(--accent); text-decoration: none; }
    .links a { display: inline-block; margin: 6px 18px 6px 0; color: var(--accent); text-decoration: none; font-size: 14px; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>DLPC <span class="muted">// Docs</span></h1>
    <span class="back"><a href="./">← landing</a> · <a href="./exp/">experiments hub</a></span>
  </header>

  <main id="report" class="report">
    <div class="status">loading…</div>
  </main>

  <footer class="foot">Rendered live from the repo's <code>*.md</code> via <a href="https://marked.js.org/" title="marked markdown parser">marked</a> (CDN).</footer>

  <script>
    (function () {
      'use strict';

      const DOCS = [
        ['spec/requirements.md', 'Spec · requirements'],
        ['spec/design.md', 'Design intent'],
        ['spec/tasks.md', 'Tasks &amp; roadmap'],
        ['docs/architecture.md', 'Architecture'],
        ['docs/dlpc-format.md', '.dlpc binary container format'],
        ['docs/experiments/exp1a-results.md', 'Exp 1-a results'],
        ['docs/experiments/exp1b-results.md', 'Exp 1-b results'],
      ];

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error('failed to load ' + src));
          document.head.appendChild(s);
        });
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Resolve a (possibly ../../-style) path against a base directory, e.g.
      // base 'docs/experiments', rel '../../exp/x' -> 'exp/x'. Preserves a
      // trailing slash (directory links).
      function resolve(base, rel) {
        const trailing = rel.endsWith('/');
        const parts = (base ? base.split('/').filter(Boolean) : []).concat(rel.split('/'));
        const out = [];
        for (const p of parts) {
          if (p === '' || p === '.') continue;
          if (p === '..') { out.pop(); continue; }
          out.push(p);
        }
        return out.join('/') + (trailing ? '/' : '');
      }

      // Rewrite the anchors of a rendered markdown fragment so relative links
      // resolve relative to the *markdown file's directory* (not the viewer's
      // URL): .md targets go back through this viewer, everything else is a
      // repo-root-relative path.
      function rebaseLinks(fragment, baseDir) {
        const doc = new DOMParser().parseFromString(fragment, 'text/html');
        doc.querySelectorAll('a[href]').forEach((a) => {
          let href = a.getAttribute('href') || '';
          if (!href || /^(https?:|mailto:|#|data:)/.test(href)) return;
          const qi = href.indexOf('?');
          const path = qi === -1 ? href : href.slice(0, qi);
          const query = qi === -1 ? '' : href.slice(qi);
          const resolved = resolve(baseDir, path);
          if (/\.md$/.test(resolved)) {
            a.setAttribute('href', 'md.html?f=' + encodeURIComponent(resolved) + query);
          } else {
            a.setAttribute('href', resolved + query);
          }
        });
        return doc.body.innerHTML;
      }

      async function showDoc(f) {
        const el = document.getElementById('report');
        el.innerHTML = '<div class="status">loading ' + escapeHtml(f) + '…</div>';
        try {
          const res = await fetch(f);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const md = await res.text();
          const html = window.marked ? window.marked.parse(md) : '<pre><code>' + escapeHtml(md) + '</code></pre>';
          const baseDir = f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : '';
          el.innerHTML = rebaseLinks(html, baseDir);
          document.title = 'DLPC · ' + f;
        } catch (e) {
          el.innerHTML = '<div class="status">could not load ' + escapeHtml(f) + ': ' + escapeHtml(e.message) + '</div>';
        }
      }

      function showIndex() {
        const el = document.getElementById('report');
        el.innerHTML = '<h1>Docs &amp; reports</h1><p>Rendered live from the repo markdown via marked.</p>' +
          '<nav class="links">' + DOCS.map(([f, label]) => '<a href="md.html?f=' + f + '">' + label + ' →</a>').join('') + '</nav>';
      }

      async function init() {
        const f = new URLSearchParams(location.search).get('f');
        if (!f) { showIndex(); return; }
        try { await loadScript('https://cdn.jsdelivr.net/npm/marked/marked.min.js'); }
        catch (e) { console.warn('marked CDN unavailable, showing raw markdown:', e); }
        showDoc(f);
      }

      init();
    })();
  </script>
</body>
</html>
